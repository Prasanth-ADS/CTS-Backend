services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      USE_MOCK_MODEL_SERVING: "true"
      USE_MOCK_REASONING_SERVICE: "true"
      USE_MOCK_LLM: "true"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
